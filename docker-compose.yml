services:
  moderation:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: astra-moderation:latest
    container_name: astra-moderation
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data:/data
    environment:
      MOD_ADDR: ":8096"
      MOD_DATA_DIR: /data
      MOD_POLICY: /app/policy.json
      # point this at any OpenAI-compatible multimodal server
      MOD_UPSTREAM_URL: ${MOD_UPSTREAM_URL:-http://host.docker.internal:8000/v1/chat/completions}
      MOD_MODEL: ${MOD_MODEL:-Qwen/Qwen3.8-27B}
      MOD_UPSTREAM_KEY: ${MOD_UPSTREAM_KEY:-}
      MOD_DISABLE_THINKING: ${MOD_DISABLE_THINKING:-true}
      MOD_MAX_VIDEO_SEC: ${MOD_MAX_VIDEO_SEC:-120}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
